name: Install count

# Once a day, the "install-count" release's downloads so far are written down in
# install-count.csv on the install-stats branch, with the rise since the last day. Each Zia
# install with "Count this install" on downloads it once a day (src/js/28v-install-count.js),
# so a day's rise is about how many installs were in use.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: install-stats
      - name: Write down today's total
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/install-count" --jq '[.assets[].download_count] | add // 0')
          last=$(tail -n 1 install-count.csv | cut -d, -f2)
          case "$last" in ''|*[!0-9]*) last=$total ;; esac
          echo "$(date -u +%F),$total,$((total - last))" >> install-count.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install-count.csv
          git commit -m "Install count $(date -u +%F)"
          git push
