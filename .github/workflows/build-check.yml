name: Build check

# zia.uc.js and chrome.css are built from src/: this fails if they've been edited directly,
# or src/ changed without rebuilding. Then lint (ESLint, Stylelint) and the code map
# (docs/MAP.md, made from the code by scripts/map.mjs) must be current.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build.sh --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: scripts/lint.sh
      - run: node scripts/map.mjs --check
